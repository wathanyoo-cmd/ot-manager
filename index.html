<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.webmanifest"><title>OT Manager</title>
<style>
body{margin:0;background:#f2f6fa;color:#102a43;font-family:system-ui,sans-serif}header{background:#102a43;color:white;padding:22px;border-radius:0 0 22px 22px}main{max-width:700px;margin:auto;padding:14px}.card{background:white;padding:16px;border-radius:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;margin:8px 0 4px;color:#526579}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd8e2;border-radius:10px;font:inherit}button{padding:12px 16px;border:0;border-radius:10px;background:#087e8b;color:white;font-weight:bold;margin:8px 6px 0 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#edf6f7;padding:12px;border-radius:12px}.stat b{display:block;font-size:21px}.muted{font-size:12px;color:#68798a}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h2>⏱ OT Manager</h2><small>บันทึกเวลาและคำนวณ OT ร่วมกันผ่าน Cloud</small></header><main>
<section class="card"><div class="grid"><div><label>รหัสทีม PIN</label><input id="pin" type="password"></div><div><label>เดือน</label><input id="month" type="month"></div></div><button onclick="load()">โหลดข้อมูล Cloud</button><span id="conn" class="muted">ยังไม่เชื่อมต่อ</span></section>
<section class="card"><h3>บันทึกเวลาทำงาน</h3><div class="grid">
<div><label>วันที่</label><input id="date" type="date"></div><div><label>ชื่อพนักงาน</label><input id="employee"></div>
<div><label>ผลัด</label><select id="shift" onchange="setShift()"><option>เช้า</option><option>บ่าย</option><option>ดึก</option><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option><option>ขาดงาน</option></select></div>
<div><label>สถานะ</label><select id="status"><option>ปกติ</option><option>ลาป่วย</option><option>ลากิจ</option><option>ลาพักร้อน</option><option>ขาดงาน</option></select></div>
<div><label>เวลาเข้า</label><input id="start" type="time" value="08:00"></div><div><label>เลิกปกติ</label><input id="end" type="time" value="17:00"></div>
<div><label>เริ่ม OT เช้า</label><input id="morning" type="time"></div><div><label>เวลาออกจริง</label><input id="actual" type="time"></div>
<div><label>ค่าแรงรายวัน</label><input id="wage" type="number" value="600"></div><div><label>ตัวคูณ OT</label><input id="mult" type="number" value="1.5" step=".1"></div></div>
<div class="stats"><div class="stat">OT เช้า<b id="mout">0:00</b></div><div class="stat">OT เย็น<b id="eout">0:00</b></div><div class="stat">OT รวม<b id="tout">0:00</b></div><div class="stat">เงิน OT<b id="pout">฿0.00</b></div></div>
<button onclick="save()">บันทึก Cloud</button><button onclick="calc()">คำนวณ</button><p id="msg" class="muted"></p></section>
<section class="card"><h3>สรุปรายเดือน</h3><div id="summary" class="muted">ยังไม่ได้โหลดข้อมูล</div><div id="records"></div></section>
</main><script src="app-config.js"></script><script>
const $=x=>document.getElementById(x), shifts={เช้า:['08:00','17:00'],บ่าย:['13:00','22:00'],ดึก:['16:00','01:00']};let data=[];
function mins(t){if(!t)return null;let a=t.split(':').map(Number);return a[0]*60+a[1]}function span(a,b){if(a==null||b==null)return 0;return (b-a+1440)%1440}function fmt(n){n=Math.round(n);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function money(n){return '฿'+n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function setShift(){let s=$('shift').value;if(shifts[s]){$('start').value=shifts[s][0];$('end').value=shifts[s][1];$('status').value='ปกติ'}else{$('start').value='';$('end').value='';$('status').value=s}calc()}
function calc(){let m=span(mins($('morning').value),mins($('start').value)),raw=span(mins($('end').value),mins($('actual').value)),e=Math.max(0,raw-(raw>210?60:0)),att=['ปกติ','ลาป่วย'].includes($('status').value),total=att?m+e:0,w=+$('wage').value||0,mul=+$('mult').value||1.5,p=total*w/8*mul;$('mout').textContent=fmt(m);$('eout').textContent=fmt(e);$('tout').textContent=fmt(total);$('pout').textContent=money(p);return {m,raw,e,total,w,mul,p,att}}
async function api(body){let url=window.OT_CONFIG?.API_URL;if(!url||url.includes('PASTE_'))throw Error('ยังไม่ได้ตั้งค่า API_URL ใน app-config.js');let r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pin:$('pin').value})});return r.json()}
async function save(){try{let c=calc(),r={workDate:$('date').value,employee:$('employee').value,shift:$('shift').value,status:$('status').value,startTime:$('start').value,endTime:$('end').value,morningOtStart:$('morning').value,actualOut:$('actual').value,morningOtHours:c.m/60,eveningOtRawHours:c.raw/60,eveningOtNetHours:c.e/60,totalOtHours:c.total/60,dailyWage:c.w,hourlyWage:c.w/8,otMultiplier:c.mul,otPay:c.p,attendancePay:c.att?c.w:0,dailyTotal:(c.att?c.w:0)+c.p};if(!r.employee||!r.workDate)throw Error('กรอกวันที่และชื่อพนักงาน');let x=await api({action:'save',record:r});if(!x.ok)throw Error(x.error);$('msg').textContent='บันทึกแล้ว';load()}catch(e){$('msg').textContent=e.message}}
async function load(){try{let x=await api({action:'list',month:$('month').value});if(!x.ok)throw Error(x.error);data=x.records||[];$('conn').textContent='เชื่อมต่อ Cloud แล้ว';let ot=data.reduce((s,r)=>s+(+r.totalOtHours||0),0),pay=data.reduce((s,r)=>s+(+r.otPay||0),0),sum=data.reduce((s,r)=>s+(+r.dailyTotal||0),0);$('summary').textContent=`${data.length} รายการ · OT ${fmt(ot*60)} · เงิน OT ${money(pay)} · รวม ${money(sum)}`;$('records').innerHTML=data.map(r=>`<p>${r.workDate} · ${r.employee} · ${r.shift} · OT ${fmt((+r.totalOtHours||0)*60)} · ${money(+r.otPay||0)}</p>`).join('')}catch(e){$('conn').textContent=e.message}}
$('date').value=new Date().toLocaleDateString('en-CA');$('month').value=$('date').value.slice(0,7);setShift();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
